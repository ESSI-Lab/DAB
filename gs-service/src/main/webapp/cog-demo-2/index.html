<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.9.0/ol.css">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
          "imports": {
            "ol": "https://esm.sh/ol@10.9.0",
            "ol/": "https://esm.sh/ol@10.9.0/"
          }
        }
    </script>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
    <div id="timeMain">Loading indices...</div>

    <div class="layer-container" style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px;">
        <span style="font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase;">Indicator Metric:</span>
        <select id="layerSelector" style="padding: 6px; font-size: 13px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: #fff; font-weight: bold;">
            <option value="wct">Wind Chill Temperature (WCT)</option>
            <option value="at">Apparent Temperature (AT)</option>
            <option value="wbgt">Wet Bulb Globe Temperature (WBGT)</option>
            <option value="utci">Universal Thermal Climate Index (UTCI)</option>
        </select>
    </div>

    <div class="event-container" style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px;">
        <span style="font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase;">Curated Events:</span>
        <select id="eventSelector" style="padding: 6px; font-size: 13px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: #fff;">
        </select>
    </div>

    <div class="jump-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-top: 8px; border-top: 1px solid #eee;">
        <span style="font-size: 12px; color: #555;">Pick a Date:</span>
        <input type="date" id="datePicker">
    </div>

    <div class="hour-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 12px; color: #555;">Select Hour (UTC):</span>
        <select id="hourSelector" style="padding: 4px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: #fff; width: 120px;">
        </select>
    </div>

    <div id="legendTitle" class="legend-subtitle">Wind Chill Temperature (WCT)</div>
    <div id="legend"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
